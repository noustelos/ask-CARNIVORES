<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AskCarnivores">
  <!-- "AC" in the wordmark's own two tones: the A in the ink token, the C in
       the accent token, on a bg tile. Keep the light values as presentation
       attributes so the icon is correct even where the style block below is
       ignored; the CSS only overrides them for dark chrome, mirroring the token
       swap in style.css. Note: no double hyphen anywhere in an XML comment, or
       the whole file stops parsing and the favicon silently vanishes. -->
  <style>
    @media (prefers-color-scheme: dark) {
      .tile { fill: #161513; }
      .a    { fill: #f2eee7; }
      .c    { fill: #e0805f; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="12" fill="#faf7f2"/>
  <text x="32" y="43.5" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="31" font-weight="700" letter-spacing="-0.6">
    <tspan class="a" fill="#1c1a17">A</tspan><tspan class="c" fill="#9a3b23">C</tspan>
  </text>
</svg>
