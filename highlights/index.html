<!-- Same pattern as the ask panel (§16) and for the same reason: the list is
     the bot's, and this page is a window onto it rather than a second copy.
     One index, one place it is curated. The difference is that this one is a
     page rather than a panel, so it needs no JavaScript at all — a plain
     iframe, no launcher, no open/close.

     The stylesheet went v4 -> v5 for the .frame-page rules below; assets here
     are cached immutable, so changing one means renaming it and moving every
     page's <link> with it. -->
<link rel="stylesheet" href="/assets/style.v5.css">
</head>
<body class="frame-body">

<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/">Ask<span>Carnivores</span></a>
    <!-- The site menu. Mirror any change into /index.html, /gr/index.html,
         /about/, /gr/about/ and /gr/highlights/. -->
    <nav class="site-nav" aria-label="Sections">
      <a href="/about/">My Story</a>
      <a href="/highlights/" aria-current="page">Highlights</a>
    </nav>
    <!-- The language pair points at the two halves of THIS page, not at the two
         index pages: someone switching language here wants this page in the
         other language, not to be sent back to the directory. -->
    <nav class="lang" aria-label="Language">
      <a href="/highlights/" aria-current="true" hreflang="en">EN</a>
      <span aria-hidden="true">/</span>
      <a href="/gr/highlights/" hreflang="el">ΕΛ</a>
    </nav>
  </div>
</header>

<main id="main" class="frame-main">
  <!-- NO sandbox attribute, and that is deliberate — the same rule as the ask
       panel's iframe, for a different reason here. This page runs no fetch of
       its own, so there is no Origin to break; what a sandbox would break is
       the links. Every card opens YouTube with target="_blank", and without
       allow-popups none of them would open at all. The isolation comes from
       the origin boundary and from frame-src naming exactly one host in
       _headers. Don't add it.

       The frame is not lazy: unlike the panel, this page IS the content, so
       deferring it would just show an empty screen to someone who asked for
       exactly this. -->
  <iframe class="frame-page__frame"
          src="https://askcarnivore.com/highlights"
          title="Highlights — hand-picked videos"></iframe>
</main>

<!-- NO footer on this page, deliberately.

     The framed page carries its own disclaimer — "Positions and personal
     experience, not medical advice" sits at the bottom of the bot's
     /highlights — so the portal's footer stacked a second one directly under
     the first, and broke the run of the list while doing it. The frame is the
     content here; it gets the screen.

     This is the ONLY page type that loses it. The directory pages, the story
     pages and 404.html all keep the full footer: there the disclaimer is the
     page's own promise and nothing else is making it. Do not "restore" this
     one for consistency — the reason it is gone is that it was said twice.

     What leaves with it, and where each still lives: the contact address is in
     the footers of /, /gr/, /about/, /gr/about/ and 404.html; the language pair
     is in this page's own header; the studio credit is in every other footer.

     Mirror any change into /gr/highlights/index.html. -->

</body>
</html>
